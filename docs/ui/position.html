<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;background:#1f1f1f;}
  .shell{display:flex;height:100vh;background:#1f1f1f;}
  .activity{width:48px;flex:0 0 48px;background:#181818;border-right:1px solid #2b2b2b;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px;}
  .activity .item{width:48px;height:40px;display:flex;align-items:center;justify-content:center;color:#9d9d9d;position:relative;}
  .activity .item.active{color:#ffffff;}
  .activity .item.active:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:#007fd4;border-radius:2px;}
  .activity svg{width:22px;height:22px;}
  .frame{flex:1;border:0;width:100%;height:100vh;background:#1f1f1f;}
</style></head><body>

  </div>
  <iframe class="frame" src="setup.html"></iframe>
</div>
</body></html>
