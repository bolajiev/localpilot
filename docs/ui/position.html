<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;background:#1f1f1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ccc;font-size:12px;}
  .shell{display:flex;height:100vh;}
  .activity{width:48px;flex:0 0 48px;background:#181818;border-right:1px solid #2b2b2b;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:8px;color:#9d9d9d;}
  .activity .i{width:42px;height:36px;display:flex;align-items:center;justify-content:center;}
  .activity .i.active{color:#fff;background:#2a2d2e;border-left:2px solid #007fd4;}
  .files{width:220px;flex:0 0 220px;background:#1f1f1f;border-right:1px solid #2b2b2b;padding:10px 8px;}
  .files h4{font-size:10px;letter-spacing:.8px;color:#9d9d9d;margin:0 8px 10px;font-weight:600;}
  .row{padding:3px 8px;color:#c9c9c9;white-space:nowrap;}
  .row.muted{color:#777;}
  .row.folder{color:#d7d7d7;}
  .editor{flex:1;background:#1e1e1e;border-right:1px solid #2b2b2b;display:flex;align-items:center;justify-content:center;color:#555;}
  .editor .empty{border:1px dashed #333;padding:22px 30px;border-radius:6px;}
  .right{width:390px;flex:0 0 390px;background:#1f1f1f;border-left:1px solid #333;}
  iframe{width:390px;height:100vh;border:0;display:block;background:#1f1f1f;}
  svg{width:20px;height:20px;}
</style></head><body>
<div class="shell">
  <div class="activity">
    <div class="i" title="Explorer">▤</div>
    <div class="i" title="Search">⌕</div>
    <div class="i" title="Source Control">⑂</div>
    <div class="i" title="Run">▷</div>
  </div>
  <div class="files">
    <h4>EXPLORER</h4>
    <div class="row folder">▾ LOCALPILOT</div>
    <div class="row">▾ src</div>
    <div class="row muted">　extension.ts</div>
    <div class="row muted">　chatView.ts</div>
    <div class="row muted">　agentTools.ts</div>
    <div class="row">　package.json</div>
    <div class="row">　README.md</div>
  </div>
  <div class="editor"><div class="empty">File editor</div></div>
  <div class="right"><iframe src="setup.html"></iframe></div>
</div>
</body></html>
